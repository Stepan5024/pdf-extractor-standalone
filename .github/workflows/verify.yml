name: Verify Linux release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-java17:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Install local OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-rus
      - name: Confirm downloadable artifact is tracked in release source
        run: |
          git ls-files --error-unmatch dist/pdf-extractor-standalone.jar
          sha256sum dist/pdf-extractor-standalone.jar
      - name: Compile, format checks and regression tests
        run: |
          mkdir -p target/test-tmp
          mvn --batch-mode -Pfat-jar verify -Djava.io.tmpdir="$PWD/target/test-tmp"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Run tests on Java 17
        run: mvn --batch-mode surefire:test -Djava.io.tmpdir="$PWD/target/test-tmp"
      - name: Smoke-test Linux build on Java 17
        run: bash scripts/smoke-test.sh "$PWD/target/pdf-extractor-standalone-3.0.3.jar"
      - name: Smoke-test downloadable JAR on Java 17
        run: bash scripts/smoke-test.sh "$PWD/dist/pdf-extractor-standalone.jar"
